// compose_compiler_config.conf — Compose compiler STABILITY CONFIGURATION for the kernel
// classes that cross composition boundaries. :core is a pure-JVM module compiled WITHOUT
// the Compose compiler, so its classes carry no stability metadata and every composable
// parameter typed on them is classified UNSTABLE by inference — this file declares the
// classes' real contracts instead. Consumers wire it via the composeCompiler
// { stabilityConfigurationFiles } option (:render here; the closed :app assembly names
// this same file — the ONE-copy rule, the runtime.js precedent).
//
// WHAT QUALIFIES (read before adding a line): a class may be listed only if composition
// can never observe a silent mutation through it — either (a) it is immutable after
// construction, or (b) every composition-visible read of it rides the sink→snapshot
// mirror (State.kt's StackStore.sink / DSX.state.sink → mutableStateOf), so recomposition
// is driven by the snapshot, never by the object's own fields (StackNodeView.kt's
// "@ObservedObject twin" header documents the contract).
//
// VERIFICATION HONESTY: this classification is compile-time-verified only (both consumers
// build green; the compiler now treats these parameters as stable/skippable). Runtime
// recomposition gains need device profiling — the Layout-Inspector/composition-trace pass
// on hardware is the documented device-QA follow-up.
//
// • StackNode — the parsed DSX AST node (StackNode.kt). De-facto IMMUTABLE once
//   StackXML.parse returns: the only field writes in the tree are the parser's own
//   reinject() (pre-return); no kernel, module, or host code assigns attrs/children/text
//   afterwards (dsx.node overrides live in :render's RenderStoreFields sidecar, never on
//   the node). Every StackNodeView/NodeContent/element signature takes it.
despia.engine.StackNode
// • StackStore — the per-surface reactive store (Jse.kt). Mutable maps by design, but
//   composition NEVER depends on its fields directly: each StackNodeView mirrors store
//   publishes into Compose state via store.sink (contract (b) above), and the store
//   reference itself is surface-stable (remember { StackStore() }).
despia.engine.StackStore
// • JSERunner — the per-surface expression runtime bound to its StackStore (JseRunner.kt).
//   Same contract as the store it wraps: surface-stable reference, all reactivity through
//   the store's sink mirror.
despia.engine.JSERunner
