# Required for any module pulling androidx artifacts (:platform / :render).
android.useAndroidX=true
# Kernel builds are small; keep the JVM modest and builds reproducible.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Release and developer builds use the explicitly supplied JDK 21. Do not scan
# unrelated host JDKs or download a mutable toolchain behind the lock graph.
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
