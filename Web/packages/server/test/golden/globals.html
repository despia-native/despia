<!-- golden: globals -->
<div data-dsx-owner="Golden" class="dsx-stack">
<div class="dsx-table-frame" style="--dsx-table-columns: 3" role="region" tabindex="0" data-dsx-truncated="false" aria-label="Data table">
<table class="dsx-table" aria-rowcount="3" aria-colcount="3">
<thead>
<tr>
<th scope="col">Item</th>
<th scope="col">Qty</th>
<th scope="col">Total</th>
</tr>
</thead>
<tbody>
<tr aria-label="Espresso, 2, $7.00">
<td title="Espresso">Espresso</td>
<td title="2">2</td>
<td title="$7.00">$7.00</td>
</tr>
<tr aria-label="Bun, 1, $3.50">
<td title="Bun">Bun</td>
<td title="1">1</td>
<td title="$3.50">$3.50</td>
</tr>
</tbody>
</table>
</div>
<div class="dsx-accordion dsx-accordion-open">
<button class="dsx-accordion-header" type="button" aria-expanded="true">
<span class="dsx-accordion-title">Details</span>
<span class="dsx-accordion-chevron" aria-hidden="true">›</span>
</button>
<div class="dsx-accordion-body">
<span class="dsx-text">Body copy</span>
</div>
</div>
<div class="dsx-accordion">
<button class="dsx-accordion-header" type="button" aria-expanded="false" data-dsx-part="header">
<span class="dsx-text">Custom header</span>
</button>
<div class="dsx-accordion-body" hidden>
<span class="dsx-text">Body</span>
</div>
</div>
<label class="dsx-checkbox">
<input type="checkbox">
<span class="dsx-checkbox-box" aria-hidden="true">
</span>
<span class="dsx-checkbox-label">I agree</span>
</label>
<div class="dsx-chat-bubble dsx-chat-right">
<div class="dsx-chat-bubble-body">
<span class="dsx-chat-bubble-value">Hello</span>
</div>
</div>
<div class="dsx-skeleton" aria-hidden="true">
</div>
<div class="dsx-progress-ring" role="progressbar" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.5" aria-label="Progress">
<svg viewBox="0 0 100 100" aria-hidden="true">
<circle cx="50" cy="50" r="45" fill="none" stroke-width="10" stroke="var(--dsx-ring-track)">
</circle>
<circle cx="50" cy="50" r="45" fill="none" stroke-width="10" class="dsx-progress-ring-arc" stroke="var(--dsx-ring-color)" stroke-linecap="round" stroke-dasharray="282.7433388230814" stroke-dashoffset="141.3716694115407">
</circle>
</svg>
<span class="dsx-progress-ring-label">
</span>
</div>
</div>
