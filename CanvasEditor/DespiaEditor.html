<header><b>DSX Editor</b> — the canvas editor as a self-contained web component (this page inlines its runtime; nothing to install, no server)</header>

<pre id="events"></pre>
<script>
  const ed = document.getElementById("ed");
  const events = document.getElementById("events");
  for (const name of ["ready", "select", "change", "drop", "preview", "edit"]) {
    ed.addEventListener(name, (e) => {
      const brief = name === "change" ? "{tree: …}" : JSON.stringify(e.detail)?.slice(0, 140);

    });
  }

  .sc-viewport {

    --sc-accent: #146ef5; --sc-comp: #63d489; --sc-data: #8a63d2; --sc-grp: #8a63d2;

  /* phone frame */
  .sc-board {

    padding: 13px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.07), 0 2px 6px rgba(0,0,0,0.4), 0 28px 80px rgba(0,0,0,0.6);
    display: flex; flex-direction: column;

    position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
    width: 122px; height: 35px; border-radius: 18px; background: #000; z-index: 3;
    pointer-events: none; box-shadow: inset 0 0 2px rgba(255,255,255,0.08);
  }
  .sc-island::after {
    content: ''; position: absolute; right: 17px; top: 50%; transform: translateY(-50%);
    width: 9px; height: 9px; border-radius: 5px;
    background: radial-gradient(circle at 35% 35%, #1e2a4a, #05070d 65%);
  }
  .sc-screen {

    display: flex; flex-direction: column; user-select: none;
  }

  .sc-sb-time { font-size: 15px; font-weight: 650; color: #fff; letter-spacing: 0.2px; }
  .sc-sb-icons { margin-left: auto; display: flex; align-items: center; gap: 6px; color: #fff; }
  .sc-sb-icons svg { display: block; }
  .sc-content {
    flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 6px 16px 26px;
    overflow-y: auto; overscroll-behavior: none; scrollbar-width: none;
  }

  .sc-content > .sc-root { flex: 0 0 auto; min-height: 100%; }
  .sc-home {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.4);
    pointer-events: none; z-index: 2;
  }

  /* nodes (DSX flex semantics) */
  .sc-node { cursor: default; position: relative; }
  .sc-node.stack, .sc-node.vstack, .sc-node.list, .sc-node.scroll { display: flex; flex-direction: column; align-items: flex-start; }
  .sc-node.scroll { overflow-y: auto; min-height: 0; }

  .sc-empty {

    font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.32); padding: 6px; pointer-events: none;

    color: rgba(255,255,255,0.85); font-size: 18px;

  .sc-leaf-image.sc-icon {
    width: 52px; height: 52px;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.12), transparent 55%), rgba(255,255,255,0.07);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);

  .sc-leaf-slider { position: relative; height: 24px; align-self: stretch; display: flex; align-items: center; }
  .sc-slider-track { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.22); overflow: hidden; }

  .sc-slider-thumb {

  .sc-seg { padding: 5px 12px; border-radius: 7px; font-size: 12px; color: #fff; }

  .dsx-markdown h2 {
    font-size: var(--dsx-type-title2-size-fluid);
    font-weight: var(--dsx-type-headline-weight);
    letter-spacing: var(--dsx-type-title1-tracking);
    line-height: var(--dsx-type-title3-leading);
    margin-block: 2.2em 0.65em;
  }
  .dsx-markdown h3 {
    font-size: var(--dsx-type-title3-size-fluid);
    font-weight: var(--dsx-type-headline-weight);
    letter-spacing: var(--dsx-type-title2-tracking);
    line-height: var(--dsx-type-headline-leading);
    margin-block: 2em 0.6em;
  }
  .dsx-markdown h4 {
    font-size: var(--dsx-type-title3-size);
    font-weight: var(--dsx-type-headline-weight);
    letter-spacing: var(--dsx-type-headline-tracking);
    line-height: var(--dsx-type-footnote-leading);
    margin-block: 1.6em 0.5em;
  }
  .dsx-markdown h5, .dsx-markdown h6 {
    font-size: var(--dsx-type-body-size);
    font-weight: var(--dsx-type-headline-weight);
    letter-spacing: var(--dsx-type-callout-tracking);
    line-height: var(--dsx-type-footnote-leading);
    margin-block: 1.5em 0.5em;
  }
  .dsx-markdown h6 { color: var(--dsx-secondary-label); }
  /* a heading directly after a heading closes up: it is a subtitle, not a new band */
  .dsx-markdown :is(h1, h2, h3, h4) + :is(h2, h3, h4, h5, h6) { margin-block-start: 0.35em; }

  .dsx-markdown p { margin-block: 1.1em; }
  /* the lede convention: the first paragraph after the page h1 reads as a deck */
  .dsx-markdown h1 + p {
    font-size: 1.1875em;
    line-height: var(--dsx-type-body-leading);
    color: var(--dsx-secondary-label);
    letter-spacing: var(--dsx-type-title3-tracking);
  }

  /* links: accent ink over a quiet underline that fills on hover */
  .dsx-markdown a {
    color: var(--dsx-accent);
    text-decoration-line: underline;
    text-decoration-color: color-mix(in srgb, var(--dsx-accent) 35%, transparent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
    transition: text-decoration-color var(--dsx-dur-fast) var(--dsx-ease-out);
  }
  .dsx-markdown a:hover { text-decoration-color: var(--dsx-accent); }

  /* inline code: a chip. Fenced code resets the chip below. */
  .dsx-markdown code {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-variant-ligatures: none;
    font-size: 0.9em;
    background: var(--dsx-fill);
    border-radius: var(--dsx-radius-sm);
    padding: 0.1em 0.35em;
  }

  /* kbd: a bordered key cap with a bottom edge */
  .dsx-markdown kbd {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: var(--dsx-type-footnote-size);
    font-weight: var(--dsx-type-label-weight);
    color: var(--dsx-secondary-label);
    background: var(--dsx-surface-raised);
    border-radius: var(--dsx-radius-sm);
    padding: 0.15em 0.5em;
    box-shadow:
      inset 0 0 0 var(--dsx-hairline) var(--dsx-separator),

    border-radius: var(--dsx-radius-card);
    box-shadow: inset 0 0 0 var(--dsx-hairline) var(--dsx-outline-soft);
    padding: var(--dsx-space-4) var(--dsx-space-5);
    margin-block: 1.5em;
    overflow-x: auto;
    font-size: var(--dsx-type-callout-size);
    line-height: var(--dsx-type-reading-leading);
  }
  .dsx-markdown pre code {
    display: block;
    background: none;
    border-radius: 0;
    padding: 0;
    font-size: inherit;
  }

  .dsx-markdown .dsx-tok-kw { color: var(--dsx-code-keyword); }
  .dsx-markdown .dsx-tok-str { color: var(--dsx-code-string); }
  .dsx-markdown .dsx-tok-com { color: var(--dsx-code-comment); font-style: italic; }
  .dsx-markdown .dsx-tok-num { color: var(--dsx-code-number); }
  .dsx-markdown .dsx-tok-typ { color: var(--dsx-code-type); }
  .dsx-markdown .dsx-tok-pun { color: var(--dsx-code-punct); }
  .dsx-markdown .dsx-tok-fn { color: var(--dsx-code-function); }
  .dsx-markdown .dsx-tok-att { color: var(--dsx-code-attribute); }
  .dsx-markdown .dsx-tok-tag { color: var(--dsx-code-tag); }
  .dsx-markdown .dsx-tok-cst { color: var(--dsx-code-constant); }
  .dsx-markdown .dsx-tok-op { color: var(--dsx-code-operator); }

  /* tables: a padded elevated card whose header is a BAND, not a border */
  .dsx-md-table-wrap {
    overflow-x: auto;
    background: var(--dsx-surface-raised);
    border-radius: var(--dsx-radius-card);
    box-shadow: var(--dsx-shadow-1);
    padding: var(--dsx-space-2);
    margin-block: 1.5em;
  }
  .dsx-md-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: var(--dsx-type-body-size);
    line-height: var(--dsx-type-body-leading);
    font-variant-numeric: tabular-nums;
  }
  .dsx-md-table th, .dsx-md-table td {
    text-align: start;
    padding: var(--dsx-space-2) var(--dsx-space-3);
    vertical-align: top;
  }
  .dsx-md-table thead th {
    background: var(--dsx-fill);
    background-clip: padding-box;
    /* the 5px spacer between band and rows, carried as transparent border so the
       fill stops with the band instead of bleeding into the body */
    border-block-end: 5px solid transparent;
    height: 2.25rem;
    font-size: var(--dsx-type-caption-size);
    font-weight: var(--dsx-type-headline-weight);
    letter-spacing: var(--dsx-type-label-tracking);
    color: var(--dsx-secondary-label);
    vertical-align: middle;
  }
  .dsx-md-table thead th:first-child {
    border-start-start-radius: var(--dsx-radius-sm);
    border-end-start-radius: var(--dsx-radius-sm);
  }
  .dsx-md-table thead th:last-child {
    border-start-end-radius: var(--dsx-radius-sm);
    border-end-end-radius: var(--dsx-radius-sm);
  }
  .dsx-md-table tbody tr + tr td {
    border-block-start: var(--dsx-hairline) solid var(--dsx-outline-soft);
  }
  @media (hover: hover) {
    .dsx-md-table tbody tr:hover td {
      background: color-mix(in srgb, var(--dsx-fill) 55%, transparent);
    }
    .dsx-md-table tbody tr:last-child td:first-child { border-end-start-radius: var(--dsx-radius-sm); }
    .dsx-md-table tbody tr:last-child td:last-child { border-end-end-radius: var(--dsx-radius-sm); }
  }

  /* blockquote: the timeless form - a 2px neutral rail, no wash, muted ink */
  .dsx-md-quote {
    margin-block: 1.5em;
    margin-inline: 0;
    padding-block: 0.125em;
    padding-inline: var(--dsx-space-5) 0;
    border-inline-start: 2px solid var(--dsx-separator);
    color: var(--dsx-secondary-label);
  }
  .dsx-md-quote > :first-child { margin-block-start: 0; }
  .dsx-md-quote > :last-child { margin-block-end: 0; }

  .dsx-md-rule {
    border: none;
    height: var(--dsx-hairline);
    background: var(--dsx-separator);
    margin-block: 2.5em;
  }

  .dsx-md-image {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: var(--dsx-radius-card);
    outline: var(--dsx-hairline) solid var(--dsx-outline-soft);
    outline-offset: calc(-1 * var(--dsx-hairline));
    margin-block: 1.5em;
  }

  .dsx-md-list {
    margin-block: 1.1em;
    padding-inline-start: 1.5em;
  }
  .dsx-md-list li { margin-block: 0.375em; }
  .dsx-md-list li::marker {
    color: var(--dsx-tertiary-label);
    font-variant-numeric: tabular-nums;
  }
  .dsx-md-list .dsx-md-list { margin-block: 0.375em; }

  /* print: the plane flattens \u2014 hairline borders stand in for elevation */
  @media print {
    .dsx-md-table-wrap, .dsx-markdown pre {
      box-shadow: none;
      border: 1px solid var(--dsx-separator);
    }

  }

      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      min-height: 40px;
      padding: 8px 12px;
      border-radius: var(--dsx-radius-control);
      color: var(--dsx-secondary-label);
      text-align: start;
    }
    .dsx-tab-icon { width: 20px; height: 20px; }
    /* the accent tint composed OPAQUELY on the card surface: translucent accent-muted
       over the rail's grouped background lands accent text at ~4.25:1 (AA fail); the
       same 10% tint anchored on secondaryGroupedBackground is the system's passing pair */
    .dsx-tab[data-dsx-selected="true"] {
      color: var(--dsx-accent);
      background: color-mix(in srgb, var(--dsx-accent) 10%, var(--dsx-secondary-grouped-background));
    }
    .dsx-tab-label { flex: 1 1 auto; min-width: 0; font-size: var(--dsx-type-callout-size); letter-spacing: 0; line-height: var(--dsx-type-title2-leading); }
  }

  @media ${Sc} and (hover: hover) {
    .dsx-tab:hover:not(:disabled) { background: var(--dsx-fill); }
    .dsx-tab[data-dsx-selected="true"]:hover:not(:disabled) {
      background: color-mix(in srgb, var(--dsx-accent) 16%, transparent);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .dsx-tab, .dsx-tab-icon, .dsx-tab-label, .dsx-paged-dot, .dsx-list-row-content, .dsx-list-action, .dsx-list-reorder { transition-duration: 0s; }
    .dsx-tab-panel:not([hidden]) { animation: none; }
  }

  @media (forced-colors: active) {
    .dsx-toolbar, .dsx-tablist { border-color: CanvasText; background: Canvas; }
    .dsx-tab[data-dsx-selected="true"], .dsx-paged-dot[data-dsx-selected="true"] { forced-color-adjust: none; color: Highlight; }
    .dsx-tab:focus-visible, .dsx-paged-dot:focus-visible { outline: 2px solid Highlight; outline-offset: -2px; box-shadow: none; }
    .dsx-list-action:focus-visible, .dsx-list-reorder:focus-visible { outline: 2px solid Highlight; outline-offset: -2px; box-shadow: none; }
  }

<script type="module">
  // rich data through the JS property — the same deck CanvasEditor.html opens
  ed.deck = `<vstack grow="true" background="#000000">
  <head>
    <variable as="meals">return [
      { id: '1', name: 'Oatmeal &amp; Berries', calories: 340, time: '08:30' },
      { id: '2', name: 'Grilled Chicken Salad', calories: 520, time: '12:45' },
      { id: '3', name: 'Greek Yogurt', calories: 150, time: '15:20' }
    ]</variable>
    <variable as="goal">return 2000</variable>
    <variable as="consumed" computed="true">return dsx.variable.meals.reduce((sum, m) => sum + m.calories, 0)</variable>
    <variable as="remaining" computed="true">return dsx.variable.goal - dsx.variable.consumed</variable>
    <variable as="progress" computed="true">return Math.min(dsx.variable.consumed / dsx.variable.goal, 1)</variable>
    <variable as="mealCount" computed="true">return dsx.variable.meals.length</variable>
  </head>

  <scaffold>
    <vstack pin="top" padding="20" paddingTop="24">
      <hstack align="center">
        <text value="Today" fontSize="17" fontWeight="semibold" color="white"/>
        <spacer/>
        <button icon="gearshape.fill" iconSize="20" color="rgba(255,255,255,0.6)"/>
      </hstack>
    </vstack>

    <scroll>
      <vstack padding="20" spacing="24">
        <vstack style="card" padding="24" spacing="20" align="center">
          <hstack spacing="16" align="center">
            <vstack spacing="4" align="leading">
              <text value="Remaining" fontSize="13" color="rgba(255,255,255,0.5)" fontWeight="medium"/>
              <text value="{{ dsx.variable.remaining }}" fontSize="40" fontWeight="bold" color="accent"/>
              <text value="/ {{ dsx.variable.goal }} kcal" fontSize="15" color="rgba(255,255,255,0.4)"/>
            </vstack>
            <spacer/>
            <vstack spacing="4" align="trailing">
              <text value="Eaten" fontSize="13" color="rgba(255,255,255,0.5)" fontWeight="medium"/>
              <text value="{{ dsx.variable.consumed }}" fontSize="28" fontWeight="bold" color="white"/>
              <text value="kcal" fontSize="13" color="rgba(255,255,255,0.4)"/>
            </vstack>
          </hstack>
          <vstack grow="width" spacing="8">
            <progress bind="dsx.variable.progress" color="accent" height="8"/>
            <hstack>
              <text value="{{ dsx.variable.mealCount }} meals logged" fontSize="12" color="rgba(255,255,255,0.4)"/>
              <spacer/>
              <text value="{{ Math.round(dsx.variable.progress * 100) }}%" fontSize="12" color="accent" fontWeight="semibold"/>
            </hstack>
          </vstack>
        </vstack>

        <hstack spacing="10">
          <vstack grow="true" style="card" padding="16" spacing="6" align="center">
            <text value="Protein" fontSize="12" color="rgba(255,255,255,0.5)"/>
            <text value="124g" fontSize="17" fontWeight="bold" color="white"/>
            <vstack grow="width" height="4" background="rgba(255,255,255,0.1)" radius="2">
              <vstack width="70" height="4" background="#34C759" radius="2"/>
            </vstack>
          </vstack>
          <vstack grow="true" style="card" padding="16" spacing="6" align="center">
            <text value="Carbs" fontSize="12" color="rgba(255,255,255,0.5)"/>
            <text value="186g" fontSize="17" fontWeight="bold" color="white"/>
            <vstack grow="width" height="4" background="rgba(255,255,255,0.1)" radius="2">
              <vstack width="55" height="4" background="#FF9500" radius="2"/>
            </vstack>
          </vstack>
          <vstack grow="true" style="card" padding="16" spacing="6" align="center">
            <text value="Fat" fontSize="12" color="rgba(255,255,255,0.5)"/>
            <text value="52g" fontSize="17" fontWeight="bold" color="white"/>
            <vstack grow="width" height="4" background="rgba(255,255,255,0.1)" radius="2">
              <vstack width="40" height="4" background="#FF2D55" radius="2"/>
            </vstack>
          </vstack>
        </hstack>

        <vstack spacing="12">
          <hstack align="center">
            <text value="Today's Meals" fontSize="20" fontWeight="bold" color="white"/>
            <spacer/>
            <text value="{{ dsx.variable.mealCount }} items" fontSize="13" color="rgba(255,255,255,0.4)"/>
          </hstack>
          <list bind="dsx.variable.meals" key="id" spacing="8" appearance="custom">
            <row>
              <hstack padding="16" background="rgba(255,255,255,0.06)" radius="12" align="center" spacing="12">
                <vstack width="40" height="40" background="accent" radius="10" align="center">
                  <text value="{{ dsx.item.name.charAt(0) }}" fontSize="17" fontWeight="bold" color="white"/>
                </vstack>
                <vstack spacing="2" grow="width">
                  <text bind="dsx.item.name" fontSize="16" fontWeight="semibold" color="white"/>
                  <text value="{{ dsx.item.time }}" fontSize="13" color="rgba(255,255,255,0.4)"/>
                </vstack>
                <vstack align="trailing" spacing="2">
                  <text value="{{ dsx.item.calories }}" fontSize="16" fontWeight="bold" color="white"/>
                  <text value="kcal" fontSize="11" color="rgba(255,255,255,0.4)"/>
                </vstack>
              </hstack>
            </row>
          </list>
        </vstack>
      </vstack>
    </scroll>

    <hstack pin="bottom" padding="20" paddingBottom="28">
      <spacer/>
      <button icon="plus" iconSize="24" color="white" width="56" height="56" background="accent" radius="28"/>
    </hstack>
  </scaffold>
</vstack>
`;
</script>
</body>
</html>
